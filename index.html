<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager | AUREX Week 4</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>Task Manager</h1>
        <p>Manage your daily tasks easily</p>
    </header>
    <!-- Main Content -->
    <main class="task-container">
        <!-- Add Task Section -->
        <section class="task-form-section">
            <h2>Add New Task</h2>
            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task..."
                    required >
                <button type="submit" id="addTaskBtn">
                    Add Task
                </button>
            </form>
            <!-- Validation message will appear here -->
            <p id="validationMessage"></p>
        </section>
        <!-- Filter Section -->
        <section class="filter-section">
            <h2>My Tasks</h2>
            <div class="filter-buttons">
                <button
                    type="button"
                    class="filter-btn active"
                    data-filter="all">
                    All
                </button>
                <button
                    type="button"
                    class="filter-btn"
                    data-filter="active">
                    Active
                </button>
                <button
                    type="button"
                    class="filter-btn"
                    data-filter="completed">
                    Completed
                </button>
            </div>
        </section>
        <!-- Task List -->
        <section class="task-list-section">
            <div id="taskList">
                <!-- Tasks will be added here using JavaScript -->
            </div>
        </section>
    </main>
    <!-- Footer -->
    <footer class="footer">
        <p>AUREX Full-Stack Engineering Internship — Week 4</p>
    </footer>
    <!-- JavaScript -->
    <script src="script/main.js"></script>
</body>
</html>
